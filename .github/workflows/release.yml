name: release

on:
  push:
    branches:
      - main

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - name: Release
        uses: igordanchenko/actions/semantic-release@d460545dc978b327e8d2b2cfe0acb86075a660c1 # v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
